// =========================================================
// 1) 지도 기본 설정 : 세계지도를 화면에 띄웁니다
// =========================================================
var map = L.map('map', { worldCopyJump: true }).setView([20, 20], 2);

// =========================================================
// 1-0) 한국어 라벨 지도 (MapLibre 벡터 지도)
//   - OpenFreeMap이라는 무료 벡터 지도 데이터를 불러온 뒤,
//     지명 표시 방식을 "한국어 이름(name:ko)이 있으면 한국어로,
//     없으면 원래 이름으로" 보이도록 스타일을 수정합니다.
//   - 인터넷 연결이 필요하며, 실패 시 예전 방식(영문/현지어 지도)으로 대체됩니다.
// =========================================================
function 한국어라벨로_바꾸기(style){
  style.layers.forEach(function(layer){
    if(layer.layout && layer.layout['text-field']){
      var 텍스트설정 = JSON.stringify(layer.layout['text-field']);
      if(텍스트설정.indexOf('"name"') !== -1){
        layer.layout['text-field'] = ['coalesce', ['get','name:ko'], ['get','name']];
      }
    }
  });
  return style;
}

fetch('https://tiles.openfreemap.org/styles/liberty')
  .then(function(res){ return res.json(); })
  .then(function(style){
    L.maplibreGL({ style: 한국어라벨로_바꾸기(style) }).addTo(map);
  })
  .catch(function(err){
    console.log("한국어 벡터 지도를 불러오지 못해 기본 지도로 대체합니다:", err);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 10
    }).addTo(map);
  });

// =========================================================
// 1-1) 판의 경계선 표시
//   출처: Peter Bird(2003) 논문을 GeoJSON으로 변환한 공개 데이터셋
//   (fraxen/tectonicplates, Open Data Commons Attribution License)
//   인터넷에서 실시간으로 불러오므로, GitHub Pages 등 온라인 환경에서만 정상 표시됩니다.
// =========================================================
fetch('https://raw.githubusercontent.com/fraxen/tectonicplates/master/GeoJSON/PB2002_boundaries.json')
  .then(function(res){ return res.json(); })
  .then(function(geo){
    L.geoJSON(geo, {
      style: { color:"#8e44ad", weight:2, dashArray:"4,4", opacity:0.85 }
    }).addTo(map);
  })
  .catch(function(err){
    console.log("판 경계 데이터를 불러오지 못했습니다:", err);

// =========================================================
// 4) 지도 위에 점 찍기 (지진=주황, 화산=빨강)
//    Leaflet의 LayerGroup으로 묶어서 버튼으로 껐다/켰다 합니다
// =========================================================
var 지진레이어 = L.layerGroup();
var 화산레이어 = L.layerGroup();

지진목록.forEach(function(d){
  var m = L.circleMarker([d.lat, d.lng], {
    radius:8, color:"#a85413", weight:2, fillColor:"#ffb703", fillOpacity:0.85
  }).bindPopup(
    "<div class='info-box-header'>🟠 " + d.이름 + "</div>" +
    "<div class='info-box-body'>" +
      "발생일: " + d.날짜 + "<br>" +
      "위치(위도,경도): " + d.lat + ", " + d.lng + "<br>" +
      "규모: " + d.규모 + "<br>" +
      "피해: " + d.피해 +
    "</div>",
    { className:"quake-popup" }
  ).addTo(지진레이어);
  m.on('mouseover', function(){ this.setRadius(12); });
  m.on('mouseout', function(){ this.setRadius(8); });
});

화산목록.forEach(function(d){
  var m = L.circleMarker([d.lat, d.lng], {
    radius:8, color:"#7f1717", weight:2, fillColor:"#e63946", fillOpacity:0.85
  }).bindPopup(
    "<div class='info-box-header'>🔺 " + d.이름 + "</div>" +
    "<div class='info-box-body'>" +
      "분화일: " + d.날짜 + "<br>" +
      "위치(위도,경도): " + d.lat + ", " + d.lng + "<br>" +
      "규모: " + d.규모 + "<br>" +
      "피해: " + d.피해 +
    "</div>",
    { className:"volcano-popup" }
  ).addTo(화산레이어);
  m.on('mouseover', function(){ this.setRadius(12); });
  m.on('mouseout', function(){ this.setRadius(8); });
});

// =========================================================
// 5) 버튼 3개 동작 : 지진 / 화산 / 모두삭제
// =========================================================
var 지진켜짐 = false;
var 화산켜짐 = false;

function 토글지진(){
  지진켜짐 = !지진켜짐;
  if(지진켜짐){ map.addLayer(지진레이어); } else { map.removeLayer(지진레이어); }
  document.getElementById('btnQuake').classList.toggle('active', 지진켜짐);
}

function 토글화산(){
  화산켜짐 = !화산켜짐;
  if(화산켜짐){ map.addLayer(화산레이어); } else { map.removeLayer(화산레이어); }
  document.getElementById('btnVolcano').classList.toggle('active', 화산켜짐);
}

function 모두삭제(){
  map.removeLayer(지진레이어);
  map.removeLayer(화산레이어);
  지진켜짐 = false; 화산켜짐 = false;
  document.getElementById('btnQuake').classList.remove('active');
  document.getElementById('btnVolcano').classList.remove('active');
}

// =========================================================
// 6) 3번 문항 채점 : 정답은 "판의 경계"
// =========================================================
var 정답 = "판의 경계";
var 피드백타이머;

function 선택지고르기(버튼, 값){
  // 이전에 선택했던 버튼들의 색을 초기화
  document.querySelectorAll('.choice-btn').forEach(function(b){
    b.classList.remove('selected-correct', 'selected-wrong');
  });
  clearTimeout(피드백타이머);

  var 피드백영역 = document.getElementById('feedback3');
  // 첫 번째 빈칸에만 선택한 답을 채우고, 두 번째 빈칸("~는?")은 항상 비워둠
  document.getElementById('blank3').textContent = 값;

  if(값 === 정답){
    버튼.classList.add('selected-correct');
    피드백영역.innerHTML = '<span class="feedback-correct">⭕ 정답입니다!</span>';
    피드백타이머 = setTimeout(function(){
      피드백영역.innerHTML = '';
    }, 3000);
  } else {
    버튼.classList.add('selected-wrong');
    피드백영역.innerHTML =
      '<span class="feedback-wrong">❌</span>' +
      '<button class="retry-btn" onclick="다시풀기()">다시 생각해볼까요?</button>';
  }
}

function 다시풀기(){
  document.querySelectorAll('.choice-btn').forEach(function(b){
    b.classList.remove('selected-correct', 'selected-wrong');
  });
  document.getElementById('blank3').innerHTML = '&nbsp;';
  document.getElementById('feedback3').innerHTML = '';
}

// =========================================================
// 7) 학습지 내용을 PDF로 저장
//    - 지도·버튼 부분은 최신 지도 기술(WebGL) 특성상 화면 캡처가 불안정해서 제외하고,
//      제목 + 학습지(답변 입력칸, 채점 결과) 부분만 캡처합니다.
//    - textarea에 입력한 글자가 캡처에 그대로 반영되도록,
//      캡처 직전에 입력값을 화면에 보이는 형태로 잠깐 맞춰줍니다.
// =========================================================
function 저장하기_PDF(){
  var 상태표시 = document.getElementById('pdfStatus');
  var 지도박스 = document.getElementById('mapBox');
  var 버튼줄 = document.getElementById('buttonRow');
  var pdf버튼 = document.getElementById('pdfBtn');

  상태표시.textContent = "PDF 만드는 중입니다... 잠시만 기다려 주세요.";

  // 캡처에 방해되는 지도/버튼 영역과 PDF버튼 자체는 잠깐 숨김
  지도박스.style.display = 'none';
  버튼줄.style.display = 'none';
  pdf버튼.style.display = 'none';
  상태표시.style.display = 'none';

  html2canvas(document.querySelector('.sheet'), { scale: 2 }).then(function(canvas){
    // 숨겼던 요소 다시 표시
    지도박스.style.display = '';
    버튼줄.style.display = '';
    pdf버튼.style.display = '';
    상태표시.style.display = '';

    var imgData = canvas.toDataURL('image/png');
    var jsPDF = window.jspdf.jsPDF;
    var pdf = new jsPDF('p', 'pt', 'a4');

    var 페이지폭 = pdf.internal.pageSize.getWidth();
    var 페이지높이 = pdf.internal.pageSize.getHeight();
    var 이미지폭 = 페이지폭;
    var 이미지높이 = canvas.height * 이미지폭 / canvas.width;

    var 남은높이 = 이미지높이;
    var 위치 = 0;

    pdf.addImage(imgData, 'PNG', 0, 위치, 이미지폭, 이미지높이);
    남은높이 -= 페이지높이;

    while(남은높이 > 0){
      위치 = 남은높이 - 이미지높이;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, 위치, 이미지폭, 이미지높이);
      남은높이 -= 페이지높이;
    }

    pdf.save('지진화산_학습지.pdf');
    상태표시.textContent = "";
  }).catch(function(err){
    지도박스.style.display = '';
    버튼줄.style.display = '';
    pdf버튼.style.display = '';
    상태표시.style.display = '';
    상태표시.textContent = "PDF 생성 중 오류가 발생했습니다.";
    console.log(err);
  });
}
</script>
</body>
</html>
